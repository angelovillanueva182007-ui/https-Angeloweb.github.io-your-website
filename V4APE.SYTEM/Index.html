<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudZilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary: #6c5ce7;
            --primary-hover: #5649c0;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --text-main: #2d3436;
            --text-light: #636e72;
            --success: #55efc4;
            --danger: #ff7675;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body { 
            background: var(--bg-gradient); 
            min-height: 100vh; 
            color: var(--text-main); 
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 1100px; 
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { 
            font-weight: 700; 
            font-size: 2rem;
            background: linear-gradient(to right, var(--primary), var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .actions { display: flex; gap: 15px; align-items: center; }
        
        input.search-bar {
            padding: 14px 20px;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
            width: 260px;
            outline: none;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: 0.3s;
        }

        input.search-bar:focus {
            background: white;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.15);
            width: 280px;
        }

        .btn-add-new, .btn-clear-all {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add-new {
            background: var(--primary);
            color: white;
        }

        .btn-add-new:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-clear-all {
            background: var(--danger);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 118, 117, 0.3);
        }

        .btn-clear-all:hover {
            background: #d63031;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .stat-card:hover { transform: translateY(-5px); }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 400;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-card .icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            opacity: 0.1;
        }

        .table-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.5);
            overflow: hidden;
        }

        .table-wrapper { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }
        
        th {
            text-align: left;
            padding: 15px 10px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }

        td {
            padding: 20px 10px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            color: var(--text-main);
            font-weight: 500;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.5); }

        .product-name { font-weight: 600; color: var(--primary); }
        .price-tag { font-family: monospace; font-size: 1.1rem; }

        .btn-action-group {
            display: flex;
            gap: 8px;
        }

        .btn-delete, .btn-edit {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete {
            background: #ffeaef;
            color: #d63031;
        }
        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        .btn-edit {
            background: #eaf3ff;
            color: #0984e3;
        }
        .btn-edit:hover {
            background: #0984e3;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            right: 25px;
            top: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: 0.2s;
        }

        .close-modal:hover { color: #ff7675; transform: rotate(90deg); }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #f1f2f6;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: #f9f9f9;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-save, .btn-cancel {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save {
            background: var(--primary);
            color: white;
        }
        .btn-save:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: #f1f2f6;
            color: var(--text-main);
        }
        .btn-cancel:hover { background: #dfe6e9; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✨ CloudZilla</h1>
        <div class="actions">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search inventory...">
            <button class="btn-add-new" onclick="openModal()">
                <span>+</span> Add Item
            </button>
            <button class="btn-clear-all" onclick="clearAll()">
                <span>×</span> Clear All
            </button>
        </div>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Products</h3>
            <p class="value" id="totalItems">0</p>
            <span class="icon">📦</span>
        </div>

        <div class="stat-card">
            <h3>Total Quantity</h3>
            <p class="value" id="totalQty">0</p>
            <span class="icon">🧮</span>
        </div>

        <div class="stat-card">
            <h3>Inventory Cost</h3>
            <p class="value" id="totalCost">₱0</p>
            <span class="icon">💸</span>
        </div>

        <div class="stat-card">
            <h3>Potential Profit</h3>
            <p class="value" id="totalProfit">₱0</p>
            <span class="icon">📈</span>
        </div>
    </div>

    <!-- Table -->
    <div class="table-card">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>                     
                      <th>Product</th>
                      <th>Cost (₱)</th>
                      <th>Sell (₱)</th>
                      <th>Qty</th>
                      <th>Total Value</th>
                      <th>Action</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="itemModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 class="modal-title" id="modalTitle">Add New Product</h2>
        <form id="inventoryForm">
            <input type="hidden" id="itemId">
            
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="productName" placeholder="e.g. Black Elite" required>
            </div>

            <div class="form-group">
                <label>Cost Price (₱)</label>
                <input type="number" id="costPrice" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Selling Price (₱)</label>
                <input type="number" id="sellingPrice" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="quantity" placeholder="0" required>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-save">Save Item</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Load data from LocalStorage
    let inventory = JSON.parse(localStorage.getItem('cloudZillaInventory')) || [];

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
        renderTable();
        updateStats();
    });

    // Modal handling
    const modal = document.getElementById('itemModal');
    const tableBody = document.getElementById('inventoryTableBody');
    const searchInput = document.getElementById('searchInput');
    const form = document.getElementById('inventoryForm');

    function openModal() {
        modal.style.display = 'flex';
        document.getElementById('modalTitle').innerText = 'Add New Product';
        form.reset();
        document.getElementById('itemId').value = '';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }

    // Render table
    function renderTable(data = inventory) {
        tableBody.innerHTML = '';
        
        if(data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 40px; color: #b2bec3;">No products found. Add one to get started!</td></tr>`;
            return;
        }

        data.forEach(item => {
            const totalValue = item.sellingPrice * item.quantity;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><span class="product-name">${item.name}</span></td>
                <td><span class="price-tag">₱${parseFloat(item.costPrice).toFixed(2)}</span></td>
                <td><span class="price-tag" style="color:var(--success)">₱${parseFloat(item.sellingPrice).toFixed(2)}</span></td>
                <td>${item.quantity}</td>
                <td><strong>₱${totalValue.toFixed(2)}</strong></td>
                <td>
                    <div class="btn-action-group">
                        <button class="btn-edit" onclick="editItem(${item.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteItem(${item.id})">Remove</button>
                    </div>
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    // Search
    searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) return renderTable();
        const filtered = inventory.filter(i => i.name.toLowerCase().includes(q));
        renderTable(filtered);
    });

    // Form submit - add or update
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('itemId').value;
        const name = document.getElementById('productName').value.trim();
        const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;
        const sellingPrice = parseFloat(document.getElementById('sellingPrice').value) || 0;
        const quantity = parseInt(document.getElementById('quantity').value) || 0;

        if (!name) return;

        if (id) {
            // update
            const idx = inventory.findIndex(x => x.id == id);
            if (idx > -1) {
                inventory[idx] = { ...inventory[idx], name, costPrice, sellingPrice, quantity };
            }
        } else {
            // add
            const newItem = {
                id: Date.now(),
                name,
                costPrice,
                sellingPrice,
                quantity
            };
            inventory.push(newItem);
        }

        saveAndRefresh();
        closeModal();
    });

    function editItem(id) {
        const item = inventory.find(i => i.id == id);
        if (!item) return;
        document.getElementById('itemId').value = item.id;
        document.getElementById('productName').value = item.name;
        document.getElementById('costPrice').value = item.costPrice;
        document.getElementById('sellingPrice').value = item.sellingPrice;
        document.getElementById('quantity').value = item.quantity;
        document.getElementById('modalTitle').innerText = 'Edit Product';
        modal.style.display = 'flex';
    }

    function deleteItem(id) {
        if (!confirm('Remove this item?')) return;
        inventory = inventory.filter(i => i.id != id);
        saveAndRefresh();
    }

    function clearAll() {
        if (!confirm('Clear all inventory?')) return;
        inventory = [];
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('cloudZillaInventory', JSON.stringify(inventory));
        renderTable();
        updateStats();
    }

    function updateStats() {
        document.getElementById('totalItems').innerText = inventory.length;
        document.getElementById('totalQty').innerText = inventory.reduce((s, i) => s + (i.quantity || 0), 0);
        const totalCost = inventory.reduce((s, i) => s + ((i.costPrice || 0) * (i.quantity || 0)), 0);
        document.getElementById('totalCost').innerText = `₱${totalCost.toFixed(2)}`;
        const profit = inventory.reduce((s, i) => s + (((i.sellingPrice || 0) - (i.costPrice || 0)) * (i.quantity || 0)), 0);
        document.getElementById('totalProfit').innerText = `₱${profit.toFixed(2)}`;
    }

</script>
</body>
</html>
